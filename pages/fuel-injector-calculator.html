<!-- Fuel Injector Calculator - Original Styling, Responsive -->
<style>
.calculators-wrapper {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
  margin: 20px auto;
  max-width: 1200px;
}

.calculator-container {
  flex: 1 1 420px;
  max-width: 540px;
  margin: 0;
  padding: 16px;
  font-family: inherit;
  border-radius: 8px;
  background-color: #fff;
  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.08);
  transition: box-shadow 0.3s ease;
}

.calculator-container:hover {
  box-shadow: 0 8px 12px rgba(0, 0, 0, 0.12);
}

.calculator-title {
  font-size: 1.4rem;
  font-weight: 800;
  color: #21334A;
  margin-bottom: 14px;
  text-align: center;
  border-bottom: 2px solid #f26024;
  padding-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.form-group {
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.form-group label {
  font-weight: 600;
  color: #333;
  flex: 0 0 40%;
}

.form-control {
  padding: 6px 8px;
  border: 1px solid #ddd;
  border-radius: 4px;
  min-width: 110px;
  transition: border 0.2s ease;
}

.form-control:focus {
  border-color: #f26024;
  outline: none;
  box-shadow: 0 0 0 2px rgba(242, 96, 36, 0.25);
}

.unit-control {
  display: flex;
  gap: 6px;
  align-items: center;
  flex: 0 0 60%;
  justify-content: flex-end;
}

.output-container {
  text-align: center;
  margin: 16px 0;
  padding: 12px;
  background-color: #f8f9fa;
  border-radius: 6px;
}

.output {
  font-size: 24px;
  font-weight: 700;
  color: #f26024;
  transition: all 0.3s ease;
  word-break: keep-all;
}

.reset-button {
  width: 100%;
  padding: 10px 14px;
  background-color: #f26024;
  color: #fff;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 700;
  font-size: 1rem;
  text-align: center;
  transition: all 0.2s ease;
}

.reset-button:hover {
  background-color: #d94e1f;
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

.shop-universal-actions .reset-button {
  color: #fff !important;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

.pulse {
  animation: pulse 0.6s ease;
}

@keyframes flash {
  0%, 100% { 
    border-color: #ddd;
    box-shadow: 0 0 0 0 rgba(242, 96, 36, 0);
  }
  50% { 
    border-color: #f26024;
    box-shadow: 0 0 0 3px rgba(242, 96, 36, 0.5);
  }
}

.flash-warning {
  animation: flash 0.8s ease 3;
}

@keyframes flash-yellow {
  0%, 100% {
    background-color: #fff3cd;
    box-shadow: 0 0 0 0 rgba(255, 193, 7, 0);
  }
  50% {
    background-color: #ffe69c;
    box-shadow: 0 0 14px 3px rgba(255, 193, 7, 0.7);
  }
}

.injector-warning {
  margin-top: 12px;
  padding: 10px;
  background-color: #fff3cd;
  border: 1px solid #ffc107;
  border-radius: 6px;
  color: #856404;
  font-size: 1.2rem;
  font-weight: 600;
  text-align: center;
  display: none;
}

.injector-warning.show {
  display: block;
}

.injector-warning.injector-warning-flash {
  animation: flash-yellow 0.5s ease 3;
}

<!-- Garage Display (hidden when no vehicle is saved in Garage) -->
<div id="dw-garage-display" style="display: none;"></div>

<div class="calculators-wrapper">
  <div class="calculator-container">
    <div class="calculator-title">Fuel Injector Calculator</div>
    <form id="powerInjectorForm" onsubmit="return false;">
      <div class="form-group">
        <label>Target Crank</label>
        <div class="unit-control">
          <input style="width: 100px;" placeholder="Enter value" class="form-control" id="powerValue" type="number" inputmode="decimal">
          <select class="form-control" id="powerUnit">
            <option value="HP">HP</option>
            <option value="kW">kW</option>
            <option value="PS">PS</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label># of Injectors</label>
        <input placeholder="Enter count" class="form-control" id="injectorCount" type="number" inputmode="numeric">
      </div>

      <div class="form-group">
        <label>Induction Type</label>
        <select class="form-control" id="induction">
          <option value="Turbocharged">Turbocharged</option>
          <option value="Supercharged">Supercharged</option>
          <option value="Naturally Aspirated">Naturally Aspirated</option>
        </select>
      </div>

      <div class="form-group">
        <label>Fuel Type</label>
        <select class="form-control" id="fuelType">
          <option value="Gasoline">Gasoline</option>
          <option value="Ethanol">Ethanol</option>
          <option value="Methanol">Methanol</option>
        </select>
      </div>

      <div class="form-group" id="ethanolBlendDiv" style="display: none;">
        <label>Ethanol Blend</label>
        <select class="form-control" id="ethanolBlend">
          <option value="E98">E98</option>
          <option value="E85">E85</option>
        </select>
      </div>

      <div class="form-group">
        <label>B.S.F.C. Value (optional)</label>
        <input step="0.01" placeholder="e.g., 0.65" class="form-control" id="customBSFC" type="number" inputmode="decimal">
      </div>

      <div class="form-group">
        <label>Base Fuel Pressure (PSI)</label>
        <input placeholder="43.5 (or 58 for LS)" value="43.5" step="0.5" min="20" max="100" class="form-control" id="basePressure" type="number" inputmode="decimal">
      </div>

      <div class="form-group">
        <label>Max Duty Cycle (%)</label>
        <input placeholder="Enter %" value="85" class="form-control" id="dutyCycle" type="number" inputmode="numeric" max="95" min="1">
      </div>

      <div class="output-container">
        <div class="output" id="injectorOutput">0.00 cc/min</div>
        <div id="injectorMeta" style="font-size: 13px; color: #475569; margin-top: 6px; line-height: 1.4;">Calibrated to DeatschWerks tech team BSFC table • Rated @ 43.5 PSI</div>
      </div>

      <button class="reset-button" type="button" onclick="resetPowerInjector()">Reset</button>
    </form>
  </div>
</div>

<script>
(function() {
  'use strict';
  
  const GARAGE_KEY = 'cm_variant-garage';
  const CSV_URL = 'https://cdn.shopify.com/s/files/1/0414/1681/8852/files/Applications.csv?v=1768578119';
  const UNIVERSAL_FALLBACK_HANDLES = ['universal-standard-injector-34mm', 'universal-standard-injector-48mm', 'universal-standard-injector-60mm'];
  let fitmentData = [];

  // Add to cart function - define early so it's available for onclick handlers
  window.addToCartFromCard = function(variantId, btn) {
    const prev = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Adding...';

    const cartDrawer = document.querySelector('cart-drawer');
    const formData = new FormData();
    formData.append('id', String(variantId));
    formData.append('quantity', '1');
    if (cartDrawer && typeof cartDrawer.getSectionsToRender === 'function') {
      formData.append('sections', cartDrawer.getSectionsToRender().map(s => s.id).join(','));
      formData.append('sections_url', window.location.pathname);
    }

    fetch('/cart/add.js', {
      method: 'POST',
      headers: {
        'X-Requested-With': 'XMLHttpRequest',
        'Accept': 'application/json'
      },
      body: formData
    })
    .then(r => {
      if (!r.ok) throw new Error('Add to cart failed');
      return r.json();
    })
    .then((data) => {
      btn.textContent = 'Added!';
      setTimeout(() => {
        btn.textContent = prev;
        btn.disabled = false;
      }, 1500);

      if (cartDrawer && typeof cartDrawer.renderContents === 'function' && data.sections) {
        cartDrawer.renderContents(data);
      }

      document.dispatchEvent(new CustomEvent('cart:updated'));
      if (window.Shopify && window.Shopify.theme) {
        document.dispatchEvent(new Event('cart:updated'));
      }
    })
    .catch((error) => {
      console.error('Add to cart error:', error);
      btn.textContent = 'Error';
      setTimeout(() => {
        btn.textContent = prev;
        btn.disabled = false;
      }, 1500);
    });
  };

  // ============================================================================
  // GARAGE YMM READING CODE
  // ============================================================================
  function parseGarage(raw) {
    try {
      const sets = JSON.parse(raw || '[]');
      const arr = Array.isArray(sets) ? sets : [sets];
      for (let i = arr.length - 1; i >= 0; i--) {
        const trio = Array.isArray(arr[i]) ? arr[i] : [arr[i]];
        const m = {};
        trio.forEach(it => {
          if (it && it.field) {
            m[it.field.toLowerCase()] = it.value ?? it.term ?? String(it);
          }
        });
        if (m.year && m.make && m.model) {
          return {
            year: String(m.year).trim(),
            make: String(m.make).trim(),
            model: String(m.model).trim()
          };
        }
      }
    } catch (e) {
      return null;
    }
    return null;
  }

  function readGarage() {
    try {
      const raw = localStorage.getItem(GARAGE_KEY);
      return raw ? parseGarage(raw) : null;
    } catch (e) {
      return null;
    }
  }

  function formatYMM(ymm) {
    if (!ymm) return '';
    const modelStartsWithMake = ymm.model.toLowerCase().startsWith(ymm.make.toLowerCase() + ' ');
    const line = (modelStartsWithMake
      ? `${ymm.year} ${ymm.model}`
      : `${ymm.year} ${ymm.make} ${ymm.model}`)
      .replace(/\s+/g, ' ')
      .trim();
    return line.toUpperCase();
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  // ============================================================================
  // CSV PARSING AND LOOKUP
  // ============================================================================
  function parseCSV(text) {
    const lines = text.split('\n').filter(line => line.trim());
    if (lines.length === 0) return [];
    
    const rawHeaders = parseCSVLine(lines[0]);
    // Strip BOM and trim headers so PartType, Make, Model, YearFrom, PartNumber are found
    const headers = rawHeaders.map(h => h.replace(/^\uFEFF/, '').trim());
    const data = [];
    for (let i = 1; i < lines.length; i++) {
      const values = parseCSVLine(lines[i]);
      if (values.length === 0) continue;
      
      const entry = {};
      headers.forEach((header, index) => {
        entry[header] = values[index] ? values[index].trim() : '';
      });
      data.push(entry);
    }
    return data;
  }

  function parseCSVLine(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    
    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      const nextChar = line[i + 1];
      
      if (char === '"') {
        if (inQuotes && nextChar === '"') {
          current += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (char === ',' && !inQuotes) {
        result.push(current);
        current = '';
      } else {
        current += char;
      }
    }
    result.push(current);
    return result;
  }

  function findFitment(year, make, model) {
    if (!fitmentData.length) return [];
    
    const yearNum = parseInt(year, 10);
    return fitmentData.filter(item => {
      const itemYearFrom = parseInt(item.YearFrom, 10);
      const itemYearTo = parseInt(item.YearTo, 10);
      const itemMake = (item.Make || '').toUpperCase().trim();
      const itemModel = (item.Model || '').toUpperCase().trim();
      const searchMake = (make || '').toUpperCase().trim();
      const searchModel = (model || '').toUpperCase().trim();
      
      // CSV may have only YearFrom (single-year rows); use YearTo as range when present
      const yearMatch = !isNaN(yearNum) && !isNaN(itemYearFrom) && (
        (!isNaN(itemYearTo) && itemYearTo >= itemYearFrom)
          ? (yearNum >= itemYearFrom && yearNum <= itemYearTo)
          : (yearNum === itemYearFrom)
      );
      const makeMatch = itemMake === searchMake;
      const modelMatch = itemModel === searchModel || 
                       itemModel.includes(searchModel) || 
                       searchModel.includes(itemModel);
      
      return yearMatch && makeMatch && modelMatch;
    });
  }

  function saveYMMToGarage(year, make, model) {
    try {
      // Format data to match convermax garage structure exactly
      const garageData = [{
        field: 'year',
        value: String(year).trim()
      }, {
        field: 'make',
        value: String(make).trim()
      }, {
        field: 'model',
        value: String(model).trim()
      }];
      
      // Save to convermax garage key with same structure and naming convention
      localStorage.setItem(GARAGE_KEY, JSON.stringify([garageData]));
      
      return true;
    } catch (e) {
      console.error('Error saving to garage:', e);
      return false;
    }
  }

  // Extract unique values from CSV data for dropdowns
  function getUniqueYears() {
    if (!fitmentData || fitmentData.length === 0) return [];
    const years = new Set();
    fitmentData.forEach(item => {
      const from = parseInt(item.YearFrom, 10);
      const to = parseInt(item.YearTo, 10);
      if (!isNaN(from)) {
        if (!isNaN(to) && to >= from) {
          for (let year = from; year <= to; year++) years.add(year);
        } else {
          years.add(from);  // single-year row when YearTo missing
        }
      }
    });
    return Array.from(years).sort((a, b) => b - a); // Sort descending (newest first)
  }

  function populateYearDropdown() {
    const { yearInput } = getYMMInputs();
    if (!yearInput || yearInput.tagName !== 'SELECT') return;
    
    // Get current selection to preserve it
    const currentValue = yearInput.value;
    
    // Clear existing options except the first "Select Year" option
    yearInput.innerHTML = '<option value="">Select Year</option>';
    
    // Populate years from CSV
    const years = getUniqueYears();
    years.forEach(year => {
      const option = document.createElement('option');
      option.value = year;
      option.textContent = year;
      yearInput.appendChild(option);
    });
    
    // Restore previous selection if it still exists
    if (currentValue) {
      yearInput.value = currentValue;
    }
  }

  function getUniqueMakes(year) {
    if (!fitmentData || fitmentData.length === 0) return [];
    const makes = new Set();
    const yearNum = parseInt(year, 10);
    if (isNaN(yearNum)) return [];
    
    fitmentData.forEach(item => {
      const itemYearFrom = parseInt(item.YearFrom, 10);
      const itemYearTo = parseInt(item.YearTo, 10);
      const yearOk = !isNaN(itemYearFrom) && (
        (!isNaN(itemYearTo) && itemYearTo >= itemYearFrom)
          ? (yearNum >= itemYearFrom && yearNum <= itemYearTo)
          : (yearNum === itemYearFrom)
      );
      if (yearOk && item.Make) makes.add(item.Make.trim());
    });
    return Array.from(makes).sort();
  }

  function getUniqueModels(year, make) {
    if (!fitmentData || fitmentData.length === 0) return [];
    const models = new Set();
    const yearNum = parseInt(year, 10);
    if (isNaN(yearNum) || !make) return [];
    
    const makeUpper = make.toUpperCase().trim();
    fitmentData.forEach(item => {
      const itemYearFrom = parseInt(item.YearFrom, 10);
      const itemYearTo = parseInt(item.YearTo, 10);
      const itemMake = (item.Make || '').toUpperCase().trim();
      const yearOk = !isNaN(itemYearFrom) && (
        (!isNaN(itemYearTo) && itemYearTo >= itemYearFrom)
          ? (yearNum >= itemYearFrom && yearNum <= itemYearTo)
          : (yearNum === itemYearFrom)
      );
      if (yearOk && itemMake === makeUpper && item.Model) models.add(item.Model.trim());
    });
    return Array.from(models).sort();
  }

  function getYMMInputs() {
    // Get selects by their current IDs stored in window.currentYMMIds
    let yearInput, makeInput, modelInput;
    if (window.currentYMMIds) {
      yearInput = document.getElementById(window.currentYMMIds.year);
      makeInput = document.getElementById(window.currentYMMIds.make);
      modelInput = document.getElementById(window.currentYMMIds.model);
    } else {
      // Fallback: try to find by prefix
      yearInput = document.querySelector('select[id^="ymm-year"], input[id^="ymm-year"]');
      makeInput = document.querySelector('select[id^="ymm-make"], input[id^="ymm-make"]');
      modelInput = document.querySelector('select[id^="ymm-model"], input[id^="ymm-model"]');
    }
    return { yearInput, makeInput, modelInput };
  }

  function clearYMMForm() {
    const { yearInput, makeInput, modelInput } = getYMMInputs();
    
    if (yearInput) {
      if (yearInput.tagName === 'SELECT') {
        yearInput.value = '';
      } else {
        yearInput.type = 'text';
        yearInput.setAttribute('value', '');
        yearInput.value = '';
        yearInput.defaultValue = '';
      }
      yearInput.blur();
      // Clear make and model when year is cleared
      if (makeInput) makeInput.value = '';
      if (modelInput) modelInput.value = '';
      updateMakeDropdown();
    }
    if (makeInput) {
      if (makeInput.tagName === 'SELECT') {
        makeInput.value = '';
      } else {
        makeInput.type = 'text';
        makeInput.setAttribute('value', '');
        makeInput.value = '';
        makeInput.defaultValue = '';
      }
      makeInput.blur();
      // Clear model when make is cleared
      if (modelInput) modelInput.value = '';
      updateModelDropdown();
    }
    if (modelInput) {
      if (modelInput.tagName === 'SELECT') {
        modelInput.value = '';
      } else {
        modelInput.type = 'text';
        modelInput.setAttribute('value', '');
        modelInput.value = '';
        modelInput.defaultValue = '';
      }
      modelInput.blur();
    }
    hideFitmentResults();
  }

  function checkAndShowYMMForm() {
    const ymmForm = document.getElementById('ymm-input-form');
    if (!ymmForm) return;

    const ymm = readGarage();
    if (ymm) {
      // Vehicle already in Garage — hide the manual Enter Your Vehicle box
      ymmForm.style.display = 'none';
      return;
    }

    // No vehicle in Garage — ensure inputs exist and show the Enter Your Vehicle box
    if (!window.currentYMMIds || !document.getElementById(window.currentYMMIds.year)) {
      createYMMFormInputs();
    }
    ymmForm.style.display = 'block';
  }

  function populateDropdownsFromGarage(ymm) {
    if (!ymm) return;
    
    const { yearInput, makeInput, modelInput } = getYMMInputs();
    if (!yearInput || yearInput.tagName !== 'SELECT') {
      console.log('Year dropdown not ready yet');
      return;
    }
    
    // Set year value (ensure it's a string to match option values)
    const yearStr = String(ymm.year).trim();
    const makeStr = String(ymm.make).trim();
    const modelStr = String(ymm.model).trim();
    
    // Check if year exists in dropdown
    const yearOption = Array.from(yearInput.options).find(opt => opt.value === yearStr);
    if (!yearOption) {
      console.log('Year not found in dropdown:', yearStr);
      return;
    }
    
    // Set year and update make dropdown
    yearInput.value = yearStr;
    updateMakeDropdown();
    
    // Wait for make dropdown to populate
    setTimeout(() => {
      if (!makeInput || makeInput.tagName !== 'SELECT') {
        console.log('Make dropdown not ready');
        return;
      }
      
      // Check if make exists in dropdown
      const makeOption = Array.from(makeInput.options).find(opt => opt.value === makeStr);
      if (!makeOption) {
        console.log('Make not found in dropdown:', makeStr);
        return;
      }
      
      // Set make and update model dropdown
      makeInput.value = makeStr;
      updateModelDropdown();
      
      // Wait for model dropdown to populate
      setTimeout(() => {
        if (!modelInput || modelInput.tagName !== 'SELECT') {
          console.log('Model dropdown not ready');
          return;
        }
        
        // Check if model exists in dropdown
        const modelOption = Array.from(modelInput.options).find(opt => opt.value === modelStr);
        if (!modelOption) {
          console.log('Model not found in dropdown:', modelStr);
          return;
        }
        
        // Set model
        modelInput.value = modelStr;
        
        // Search for products after all dropdowns are set
        if (fitmentData.length > 0) {
          console.log('Searching fitment for garage vehicle:', ymm);
          searchFitment(ymm);
        }
      }, 200);
    }, 200);
  }

  function showCollapsedVehicleBar(ymm) {
    const bar = document.getElementById('dw-ymm-collapsed');
    const val = document.getElementById('dw-ymm-collapsed-value');
    const ymmForm = document.getElementById('ymm-input-form');
    const legacyDisplay = document.getElementById('dw-garage-display');
    if (legacyDisplay) legacyDisplay.style.display = 'none';
    if (val && ymm) val.textContent = formatYMM(ymm);
    if (bar) bar.style.display = 'flex';
    if (ymmForm) ymmForm.style.display = 'none';
  }

  function expandVehicleSelector() {
    const bar = document.getElementById('dw-ymm-collapsed');
    const ymmForm = document.getElementById('ymm-input-form');
    if (bar) bar.style.display = 'none';
    if (ymmForm) {
      ymmForm.style.display = 'block';
      const { yearInput } = getYMMInputs();
      if (yearInput) yearInput.focus();
    }
  }

  function updateGarageDisplay() {
    const display = document.getElementById('dw-garage-display');
    const headerDisplay = document.getElementById('dw-garage-display-header');
    const bar = document.getElementById('dw-ymm-collapsed');
    if (headerDisplay) headerDisplay.textContent = '';
    if (display) display.style.display = 'none';

    const ymm = readGarage();
    if (ymm) {
      showCollapsedVehicleBar(ymm);
      if (fitmentData.length > 0) {
        searchFitment(ymm);
      }
    } else {
      if (bar) bar.style.display = 'none';
      checkAndShowYMMForm();
    }
  }

  // Track if form has been set up to prevent duplicate listeners
  let formSetupDone = false;
  
  // Handle YMM form submission
  function setupYMMForm() {
    const form = document.getElementById('ymm-form');
    if (!form || formSetupDone) return;
    
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      // Form submission is handled by dropdown change events
      // This prevents default form submission behavior
      const { yearInput, makeInput, modelInput } = getYMMInputs();
      if (!yearInput || !makeInput || !modelInput) return;
      
      const year = yearInput.value ? yearInput.value.trim() : '';
      const make = makeInput.value ? makeInput.value.trim() : '';
      const model = modelInput.value ? modelInput.value.trim() : '';
      
      // Only show alert if fields are actually empty (shouldn't happen with dropdowns)
      if (!year || !make || !model) {
        // Don't show alert - let dropdowns handle validation
        return;
      }
      
      // If all fields are filled, save and search (though this should already be done by model change handler)
      if (year && make && model) {
        saveYMMToGarage(year, make, model);
        showCollapsedVehicleBar({ year, make, model });
        if (fitmentData.length > 0) {
          searchFitment({ year, make, model });
        }
      }
    });
    
    formSetupDone = true;
  }

  async function fetchProductBySKU(partNumber) {
    try {
      console.log('Searching for product with part number:', partNumber);
      
      // Strategy 1: Try direct product handle lookup first (since part numbers match exactly)
      const handleResult = await fetchProductByHandle(partNumber);
      if (handleResult) {
        return handleResult;
      }
      
      // Strategy 2: Try search API as fallback (but handle HTML responses)
      try {
        const response = await fetch('/search.json?type=product&q=' + encodeURIComponent(partNumber));
        if (response.ok) {
          const contentType = response.headers.get('content-type');
          if (contentType && contentType.includes('application/json')) {
            const data = await response.json();
            const products = data.products || [];
            
            console.log('Found', products.length, 'products in search for:', partNumber);
            
            // First priority: Exact SKU match in variants
            for (const product of products) {
              const variants = product.variants || [];
              for (const variant of variants) {
                if (variant.sku && variant.sku.trim() === partNumber.trim()) {
                  console.log('✓ Found by exact SKU match:', partNumber, 'Product:', product.title);
                  return { product, variant };
                }
              }
            }
            
            // Second priority: Exact match in product title
            const partUpper = partNumber.toUpperCase();
            for (const product of products) {
              const titleUpper = (product.title || '').toUpperCase();
              if (titleUpper === partUpper || titleUpper.includes(partUpper)) {
                const variants = product.variants || [];
                const matchingVariant = variants.find(v => 
                  v.sku && v.sku.trim() === partNumber.trim()
                );
                if (matchingVariant) {
                  console.log('✓ Found by title with matching SKU:', partNumber, 'Product:', product.title);
                  return { product, variant: matchingVariant };
                }
                const availableVariant = variants.find(v => v.available) || variants[0];
                if (availableVariant) {
                  console.log('✓ Found by title match:', partNumber, 'Product:', product.title);
                  return { product, variant: availableVariant };
                }
              }
            }
            
            // If search returned products, use first one
            if (products.length > 0) {
              const product = products[0];
              const variants = product.variants || [];
              const variant = variants.find(v => v.available) || variants[0];
              console.log('✓ Found by search (first result):', partNumber, 'Product:', product.title);
              return { product, variant: variant || null };
            }
          } else {
            console.log('✗ Search returned non-JSON response for:', partNumber);
          }
        }
      } catch (searchError) {
        console.log('✗ Search API error for:', partNumber, searchError.message);
      }
      
      console.log('✗ No product found for:', partNumber);
      return null;
    } catch (e) {
      console.error('Error fetching product for part number:', partNumber, e);
      return null;
    }
  }

  // Primary method: Fetch product by handle using Shopify .js endpoint
  async function fetchProductByHandle(partNumber) {
    try {
      // Try common handle formats - part numbers match exactly so handle should match
      const handleFormats = [
        partNumber.toLowerCase().replace(/\s+/g, '-'),  // "16S-00-2200-8" -> "16s-00-2200-8"
        partNumber.toLowerCase(),                        // "16s-00-2200-8"
        partNumber.replace(/\s+/g, '-').toLowerCase()   // Ensure no spaces
      ];
      
      for (const handle of handleFormats) {
        try {
          // Use Shopify's .js endpoint as recommended
          const url = '/products/' + handle + '.js';
          const response = await fetch(url);
          
          if (response.ok) {
            const contentType = response.headers.get('content-type');
            // .js endpoint returns JavaScript, but we can parse it as JSON
            if (contentType && (contentType.includes('application/json') || contentType.includes('application/javascript') || contentType.includes('text/javascript'))) {
              const product = await response.json();
              const variants = product.variants || [];
              
              // First priority: Find variant with exact SKU match
              const matchingVariant = variants.find(v => 
                v.sku && v.sku.trim() === partNumber.trim()
              );
              
              if (matchingVariant) {
                console.log('✓ Found by direct handle with exact SKU match:', partNumber, 'Handle:', handle);
                return { product, variant: matchingVariant };
              }
              
              // Second priority: Use first available variant
              const availableVariant = variants.find(v => v.available) || variants[0];
              if (availableVariant) {
                console.log('✓ Found by direct handle:', partNumber, 'Handle:', handle);
                return { product, variant: availableVariant };
              }
              
              // If product exists but no variants, return product with null variant
              if (variants.length === 0) {
                console.log('✓ Found product but no variants:', partNumber, 'Handle:', handle);
                return { product, variant: null };
              }
            } else {
              console.log('✗ Unexpected content type for handle:', handle, 'Type:', contentType);
            }
          } else if (response.status === 404) {
            // Product not found at this handle, try next format
            continue;
          } else {
            console.log('✗ Error response for handle:', handle, 'Status:', response.status);
          }
        } catch (e) {
          console.log('✗ Error fetching handle:', handle, e.message);
          // Continue to next format
          continue;
        }
      }
      
      return null;
    } catch (e) {
      console.error('Error in fetchProductByHandle for:', partNumber, e);
      return null;
    }
  }

  function formatPrice(cents) {
    if (!cents) return '';
    const currency = (window.Shopify && Shopify.currency && Shopify.currency.active) || 'USD';
    return (cents / 100).toLocaleString(undefined, { style: 'currency', currency: currency });
  }

  function buildProductCardHtml(productData) {
    if (!productData || !productData.product) return '';
    const product = productData.product;
    const variant = productData.variant || (product.variants && product.variants[0]) || null;
    const productUrl = '/products/' + (product.handle || '');
    const productTitle = product.title || '';
    let imageUrl = product.featured_image || null;
    if (!imageUrl && product.images && product.images.length > 0) {
      const first = product.images[0];
      imageUrl = typeof first === 'string' ? first : (first.src || first);
    }
    const productPrice = variant && variant.price ? formatPrice(variant.price) : '';
    const productSKU = (variant && variant.sku) ? variant.sku : productTitle;
    const variantId = variant ? variant.id : null;
    const isAvailable = variant ? (variant.available !== false) : false;
    let html = '<div class="dw-card" role="group" aria-label="Product card">';
    html += imageUrl
      ? '<img src="' + imageUrl + '" alt="' + escapeHtml(productTitle) + '" loading="lazy">'
      : '<img src="https://cdn.shopify.com/s/files/1/0533/2089/files/placeholder-image.png" alt="' + escapeHtml(productTitle) + '" loading="lazy">';
    html += '<div class="sku">SKU: ' + escapeHtml(productSKU) + '</div>';
    html += '<div class="title">' + escapeHtml(productTitle) + '</div>';
    if (productPrice) html += '<div class="price">' + productPrice + '</div>';
    html += '<div class="actions"><a class="dw-link" href="' + productUrl + '">View Product</a>';
    if (variantId && isAvailable) html += '<button class="dw-btn" onclick="addToCartFromCard(' + variantId + ', this)" data-variant-id="' + variantId + '">Add to Cart</button>';
    html += '</div></div>';
    return html;
  }

  // Validate injector count against part numbers
  // Returns true if there's a mismatch, false otherwise
  function validateInjectorCount(partNumbers) {
    const injectorCountInput = document.getElementById('injectorCount');
    const injectorCount = parseInt(injectorCountInput?.value || '0', 10);
    const warningEl = document.getElementById('injector-warning');
    
    if (!injectorCount || injectorCount <= 0 || !partNumbers || partNumbers.length === 0) {
      // Hide warning if no injector count or no products
      if (warningEl) {
        warningEl.classList.remove('show');
      }
      return false; // No mismatch if no data to check
    }
    
    // Check if any part number's last digit doesn't match injector count
    let hasMismatch = false;
    for (const partNum of partNumbers) {
      if (!partNum || typeof partNum !== 'string') continue;
      
      // Extract last digit from part number
      const lastChar = partNum.trim().slice(-1);
      const lastDigit = parseInt(lastChar, 10);
      
      // Check if last digit is a valid number and doesn't match injector count
      if (!isNaN(lastDigit) && lastDigit !== injectorCount) {
        hasMismatch = true;
        console.log('Mismatch detected: Part number', partNum, 'ends with', lastDigit, 'but injector count is', injectorCount);
        break;
      }
    }
    
    if (hasMismatch) {
      // Flash the injector count input
      if (injectorCountInput) {
        injectorCountInput.classList.add('flash-warning');
        setTimeout(() => {
          injectorCountInput.classList.remove('flash-warning');
        }, 2400); // 3 flashes * 0.8s = 2.4s
      }
      
      // Show and flash the yellow alert
      if (warningEl) {
        warningEl.classList.remove('injector-warning-flash');
        void warningEl.offsetWidth; // reflow to restart animation if already showing
        warningEl.classList.add('show');
        warningEl.classList.add('injector-warning-flash');
        setTimeout(() => warningEl.classList.remove('injector-warning-flash'), 1600); // 3 * 0.5s + buffer
      }
    } else {
      // Hide warning if no mismatch
      if (warningEl) {
        warningEl.classList.remove('show');
        warningEl.classList.remove('injector-warning-flash');
      }
    }
    
    return hasMismatch;
  }

  // Extract cc/min value from calculator output
  function getCalculatorCCValue() {
    const outputEl = document.getElementById('injectorOutput');
    if (!outputEl) return null;
    const text = outputEl.textContent || '';
    // Extract number from "1234.56 cc/min" format
    const match = text.match(/([\d.]+)\s*cc\/min/i);
    if (match) {
      const value = parseFloat(match[1]);
      return isNaN(value) ? null : value;
    }
    return null;
  }

  // Extract cc/min value from product title or description
  function extractCCFromProduct(text) {
    if (!text) return null;
    // Look for patterns like "1000cc/min", "1000 cc/min", "1000cc", "1000 cc", etc.
    // Prioritize "cc/min" patterns first, then look for larger numbers (flow rates are typically 100+)
    const patterns = [
      /(\d+(?:\.\d+)?)\s*cc\s*\/\s*min/i,
      /(\d+(?:\.\d+)?)\s*cc\/min/i,
      /(\d{3,}(?:\.\d+)?)\s*cc\b/i  // Only match 3+ digit numbers for "cc" (avoids matching "4cc" from "4 Injectors")
    ];
    
    // First try patterns that explicitly look for "cc/min"
    for (let i = 0; i < 2; i++) {
      const match = text.match(patterns[i]);
      if (match) {
        const value = parseFloat(match[1]);
        if (!isNaN(value)) return value;
      }
    }
    
    // For "cc" pattern (without /min), find all matches and take the largest
    // Flow rates are typically 100cc or more, while injector counts are usually single digits
    const ccPattern = /(\d+(?:\.\d+)?)\s*cc\b/gi;
    let maxValue = null;
    let match;
    
    while ((match = ccPattern.exec(text)) !== null) {
      const value = parseFloat(match[1]);
      if (!isNaN(value) && value >= 100) { // Flow rates are typically 100cc or more
        if (maxValue === null || value > maxValue) {
          maxValue = value;
        }
      }
    }
    
    return maxValue;
  }

  function pickBestUniversalVariant(product, targetCC) {
    if (!product || !Array.isArray(product.variants) || !product.variants.length) return null;
    if (!targetCC || targetCC <= 0) return product.variants[0];
    const minCC = targetCC * 0.95;
    let best = null;
    let bestScore = Infinity;
    for (const v of product.variants) {
      const text = [v.title || '', v.option1 || '', v.option2 || '', v.option3 || '', v.sku || ''].join(' ');
      const cc = extractCCFromProduct(text);
      if (cc === null) continue;
      const score = cc >= targetCC
        ? (cc - targetCC)
        : (cc >= minCC ? (targetCC - cc) * 3 + 5000 : (targetCC - cc) * 10 + 50000);
      if (score < bestScore) {
        bestScore = score;
        best = { variant: v, cc };
      }
    }
    return best ? best.variant : product.variants[0];
  }

  // ============================================================================
  // FUEL INJECTOR CALCULATOR CODE
  // ============================================================================

  // Exact DeatschWerks Tech Team BSFC Table (6-12-2026)
  const TECH_INJ_BSFC = {
    Gasoline: { NA: 0.50, Boost: 0.65 },
    E85:      { NA: 0.70, Boost: 0.85 },
    E98:      { NA: 0.80, Boost: 0.94 },
    Methanol: { NA: 1.00, Boost: 1.77 }
  };

  const INJ_DRIVETRAIN_DIVISORS = {
    crank: 1.00,
    whp_rwd: 0.88,
    whp_auto: 0.85,
    whp_awd: 0.80
  };

  // Fuel Injector Calculator Calculation (Calibrated to Tech Team Sheet + Base Pressure)
  function calculateInjectorFlow(params) {
    const {
      power,
      powerUnit,
      injectorCount,
      induction,
      fuelType,
      ethanolBlend,
      customBSFC,
      basePressure,
      dutyCycle
    } = params;

    let crankHP = power;
    if (powerUnit === 'kW') {
      crankHP = power * 1.34102;
    } else if (powerUnit === 'PS') {
      crankHP = power * 0.9863;
    }

    const mode = induction === 'Naturally Aspirated' ? 'NA' : 'Boost';
    const fuelKey = fuelType === 'Ethanol' ? (ethanolBlend === 'E98' ? 'E98' : 'E85') : fuelType;
    const bsfc = customBSFC > 0 ? customBSFC : TECH_INJ_BSFC[fuelKey][mode];

    // Required flow at operating pressure (matches Tech Team sheet: ((HP * BSFC) / (Cyl * DC)) * 10.5)
    const flowAtOpCc = ((crankHP * bsfc) / (injectorCount * (dutyCycle / 100))) * 10.5;

    // Convert to DW 43.5 PSI (3-bar) rated injector size when running higher/lower base pressure
    const bp = basePressure > 0 ? basePressure : 43.5;
    const rated435Cc = flowAtOpCc * Math.sqrt(43.5 / bp);

    return {
      rated435Cc,
      flowAtOpCc,
      bsfc,
      crankHP,
      basePressure: bp,
      fuelLabel: `${fuelKey} ${mode}`
    };
  }

  function updateCalculator() {
    const power = parseFloat(document.getElementById('powerValue').value) || 0;
    const powerUnit = document.getElementById('powerUnit').value;
    const injectorCount = parseInt(document.getElementById('injectorCount').value) || 0;
    const induction = document.getElementById('induction').value;
    const fuelType = document.getElementById('fuelType').value;
    const ethanolBlend = document.getElementById('ethanolBlend').value;
    const customBSFC = parseFloat(document.getElementById('customBSFC').value) || 0;
    const basePressure = parseFloat(document.getElementById('basePressure').value) || 43.5;
    const dutyCycle = parseInt(document.getElementById('dutyCycle').value) || 85;

    if (power && injectorCount && dutyCycle) {
      const calc = calculateInjectorFlow({
        power,
        powerUnit,
        injectorCount,
        induction,
        fuelType,
        ethanolBlend,
        customBSFC,
        basePressure,
        dutyCycle
      });

      const ratedLbHr = calc.rated435Cc / 10.5;
      injectorOutput.textContent = `${calc.rated435Cc.toFixed(2)} cc/min`;
      if (injectorMeta) {
        const psiNote = Math.abs(calc.basePressure - 43.5) > 0.1
          ? ` • Flows ${calc.flowAtOpCc.toFixed(0)} cc/min @ ${calc.basePressure} PSI`
          : '';
        injectorMeta.textContent = `(${ratedLbHr.toFixed(1)} lb/hr rated @ 43.5 PSI${psiNote}) • ${calc.bsfc.toFixed(2)} BSFC (${calc.fuelLabel})`;
      }
      injectorOutput.classList.add('pulse');
      setTimeout(() => injectorOutput.classList.remove('pulse'), 600);
      
      // Ensure YMM form is created and visible
      checkAndShowYMMForm();
      
      // Re-filter products when calculator output changes
      const ymm = readGarage();
      if (ymm && fitmentData.length > 0) {
        searchFitment(ymm);
      }
    } else {
      injectorOutput.textContent = '0.00 cc/min';
      // Keep form visible even when calculator resets to 0
      checkAndShowYMMForm();
    }
  }

  powerInjectorForm.addEventListener('input', updateCalculator);

  // Enforce max duty cycle of 95%
  const dutyCycleInput = document.getElementById('dutyCycle');
  if (dutyCycleInput) {
    dutyCycleInput.addEventListener('input', function() {
      const value = parseFloat(this.value);
      if (!isNaN(value) && value > 95) {
        this.value = 95;
      }
    });
    dutyCycleInput.addEventListener('blur', function() {
      const value = parseFloat(this.value);
      if (!isNaN(value) && value > 95) {
        this.value = 95;
        updateCalculator();
      }
    });
  }

  fuelTypeSelect.addEventListener('change', function() {
    ethanolBlendDiv.style.display = this.value === 'Ethanol' ? 'flex' : 'none';
    updateCalculator();
  });

  // Hide warning when injector count changes (will be re-validated when products are displayed)
  const injectorCountInput = document.getElementById('injectorCount');
  if (injectorCountInput) {
    injectorCountInput.addEventListener('input', function() {
      // Validation will happen again when searchFitment runs after updateCalculator
      // But hide warning immediately for better UX
      const warningEl = document.getElementById('injector-warning');
      if (warningEl) {
        warningEl.classList.remove('show');
      }
    });
  }

  // ============================================================================
  // INITIALIZATION
  // ============================================================================
  function updateMakeDropdown() {
    const { yearInput, makeInput } = getYMMInputs();
    if (!yearInput || !makeInput || makeInput.tagName !== 'SELECT') return;
    
    const selectedYear = yearInput.value;
    makeInput.innerHTML = '<option value="">Select Make</option>';
    
    if (selectedYear) {
      const makes = getUniqueMakes(selectedYear);
      makes.forEach(make => {
        const option = document.createElement('option');
        option.value = make;
        option.textContent = make;
        makeInput.appendChild(option);
      });
      makeInput.disabled = false;
    } else {
      makeInput.disabled = true;
    }
    
    // Clear model when make changes
    const { modelInput } = getYMMInputs();
    if (modelInput && modelInput.tagName === 'SELECT') {
      modelInput.innerHTML = '<option value="">Select Model</option>';
      modelInput.disabled = true;
    }
  }

  function updateModelDropdown() {
    const { yearInput, makeInput, modelInput } = getYMMInputs();
    if (!yearInput || !makeInput || !modelInput || modelInput.tagName !== 'SELECT') return;
    
    const selectedYear = yearInput.value;
    const selectedMake = makeInput.value;
    modelInput.innerHTML = '<option value="">Select Model</option>';
    
    if (selectedYear && selectedMake) {
      const models = getUniqueModels(selectedYear, selectedMake);
      models.forEach(model => {
        const option = document.createElement('option');
        option.value = model;
        option.textContent = model;
        modelInput.appendChild(option);
      });
      modelInput.disabled = false;
    } else {
      modelInput.disabled = true;
    }
  }

  function createYMMFormInputs() {
    const form = document.getElementById('ymm-form');
    if (!form) return;
    
    // Reset form setup flag when recreating form
    formSetupDone = false;
    
    // Clear existing form content
    form.innerHTML = '';
    
    // Generate unique timestamp for this form instance
    const timestamp = Date.now() + Math.random();
    
    // Create Year dropdown
    const yearGroup = document.createElement('div');
    yearGroup.className = 'form-group';
    yearGroup.innerHTML = '<label>Year</label>';
    const yearSelect = document.createElement('select');
    yearSelect.id = 'ymm-year-' + timestamp;
    yearSelect.className = 'form-control';
    yearSelect.autocomplete = 'off';
    yearSelect.setAttribute('data-lpignore', 'true');
    yearSelect.required = true;
    yearSelect.innerHTML = '<option value="">Select Year</option>';
    
    // Populate years from CSV (will be called again after CSV loads)
    populateYearDropdown();
    
    // Add change handler to update makes when year changes
    yearSelect.addEventListener('change', function() {
      updateMakeDropdown();
      // Auto-search when all fields are filled (if year changed but make/model already selected)
      const { makeInput, modelInput } = getYMMInputs();
      if (this.value && makeInput && makeInput.value && modelInput && modelInput.value) {
        const ymm = {
          year: this.value,
          make: makeInput.value,
          model: modelInput.value
        };
        saveYMMToGarage(ymm.year, ymm.make, ymm.model);
        const display = document.getElementById('dw-garage-display');
        if (display) {
          display.textContent = formatYMM(ymm);
          display.classList.remove('dw-garage-empty');
          display.style.display = 'block';
        }
        if (fitmentData.length > 0) {
          searchFitment(ymm);
        }
      } else {
        hideFitmentResults();
      }
    });
    
    yearGroup.appendChild(yearSelect);
    form.appendChild(yearGroup);
    
    // Create Make dropdown
    const makeGroup = document.createElement('div');
    makeGroup.className = 'form-group';
    makeGroup.innerHTML = '<label>Make</label>';
    const makeSelect = document.createElement('select');
    makeSelect.id = 'ymm-make-' + timestamp;
    makeSelect.className = 'form-control';
    makeSelect.autocomplete = 'off';
    makeSelect.setAttribute('data-lpignore', 'true');
    makeSelect.required = true;
    makeSelect.innerHTML = '<option value="">Select Make</option>';
    makeSelect.disabled = true; // Disabled until year is selected
    
    // Add change handler to update models when make changes
    makeSelect.addEventListener('change', function() {
      updateModelDropdown();
      // Auto-search when all fields are filled (if make changed but model already selected)
      const { yearInput, modelInput } = getYMMInputs();
      if (yearInput && yearInput.value && this.value && modelInput && modelInput.value) {
        const ymm = {
          year: yearInput.value,
          make: this.value,
          model: modelInput.value
        };
        saveYMMToGarage(ymm.year, ymm.make, ymm.model);
        const display = document.getElementById('dw-garage-display');
        if (display) {
          display.textContent = formatYMM(ymm);
          display.classList.remove('dw-garage-empty');
          display.style.display = 'block';
        }
        if (fitmentData.length > 0) {
          searchFitment(ymm);
        }
      } else {
        hideFitmentResults();
      }
    });
    
    makeGroup.appendChild(makeSelect);
    form.appendChild(makeGroup);
    
    // Create Model dropdown
    const modelGroup = document.createElement('div');
    modelGroup.className = 'form-group';
    modelGroup.innerHTML = '<label>Model</label>';
    const modelSelect = document.createElement('select');
    modelSelect.id = 'ymm-model-' + timestamp;
    modelSelect.className = 'form-control';
    modelSelect.autocomplete = 'off';
    modelSelect.setAttribute('data-lpignore', 'true');
    modelSelect.required = true;
    modelSelect.innerHTML = '<option value="">Select Model</option>';
    modelSelect.disabled = true; // Disabled until make is selected
    
    // Add change handler to auto-search when model is selected
    modelSelect.addEventListener('change', function() {
      if (!this.value) {
        hideFitmentResults();
        return;
      }
      
      // Auto-search when all fields are filled
      const { yearInput, makeInput } = getYMMInputs();
      if (yearInput && yearInput.value && makeInput && makeInput.value && this.value) {
        const ymm = {
          year: yearInput.value,
          make: makeInput.value,
          model: this.value
        };
        // Save to garage (convermax format)
        saveYMMToGarage(ymm.year, ymm.make, ymm.model);
        showCollapsedVehicleBar(ymm);
        // Search for products
        if (fitmentData.length > 0) {
          searchFitment(ymm);
        }
      } else {
        hideFitmentResults();
      }
    });
    
    modelGroup.appendChild(modelSelect);
    form.appendChild(modelGroup);
    
    // Create submit button
    const submitBtn = document.createElement('button');
    submitBtn.type = 'submit';
    submitBtn.className = 'reset-button';
    submitBtn.textContent = 'Search Injectors';
    form.appendChild(submitBtn);
    
    // Store current IDs for reference
    window.currentYMMIds = {
      year: 'ymm-year-' + timestamp,
      make: 'ymm-make-' + timestamp,
      model: 'ymm-model-' + timestamp
    };
    
    // Note: Change handlers are already attached above in updateMakeDropdown and updateModelDropdown
    
    // Re-attach form handler
    setupYMMForm();
  }

  function init() {
    // Create form inputs dynamically to break browser history
    createYMMFormInputs();
    
    // Setup YMM form handler
    setupYMMForm();
    const changeBtn = document.getElementById('dw-ymm-change-btn');
    if (changeBtn && !changeBtn.dataset.bound) {
      changeBtn.dataset.bound = '1';
      changeBtn.addEventListener('click', function() {
        clearYMMForm();
        expandVehicleSelector();
      });
    }
    
    // Load CSV data
    fetch(CSV_URL)
      .then(response => response.text())
      .then(data => {
        fitmentData = parseCSV(data);
        console.log('Fitment data loaded:', fitmentData.length, 'entries');
        // Populate dropdowns now that CSV data is loaded
        populateYearDropdown();
        // Update garage display (this will populate dropdowns and search if garage exists)
        // Only clear form if no garage exists
        const ymm = readGarage();
        if (!ymm) {
          setTimeout(clearYMMForm, 100);
        }
        // Wait a bit longer to ensure dropdowns are populated before trying to set values
        setTimeout(() => {
          updateGarageDisplay();
        }, 150);
        updateCalculator();
      })
      .catch(error => {
        console.error('Error loading fitment data:', error);
        // Only clear form if no garage exists
        const ymm = readGarage();
        if (!ymm) {
          setTimeout(clearYMMForm, 100);
        }
        updateGarageDisplay();
        updateCalculator();
      });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  window.addEventListener('storage', (e) => {
    if (e.key === GARAGE_KEY) {
      updateGarageDisplay();
    }
  });
  
  document.addEventListener('shopify:section:load', init);
  document.addEventListener('page:load', init);

  window.resetPowerInjector = function() {
    // Reset calculator
    powerInjectorForm.reset();
    document.getElementById('dutyCycle').value = '85';
    document.getElementById('basePressure').value = '43.5';
    injectorOutput.textContent = '0.00 cc/min';
    if (injectorMeta) injectorMeta.textContent = 'Calibrated to DeatschWerks tech team BSFC table • Rated @ 43.5 PSI';
    ethanolBlendDiv.style.display = 'none';
    
    // Reset Year/Make/Model form
    clearYMMForm();
    
    // Clear garage from localStorage
    try {
      localStorage.removeItem(GARAGE_KEY);
    } catch (e) {
      console.error('Error clearing garage:', e);
    }
    
    // Clear and hide garage display
    const display = document.getElementById('dw-garage-display');
    if (display) {
      display.innerHTML = '';
      display.style.display = 'none';
    }
    
    // Clear product results
    const resultsEl = document.getElementById('fitment-results');
    if (resultsEl) {
      resultsEl.innerHTML = '';
    }
    const resultsWrapper = document.getElementById('fitment-results-wrapper');
    if (resultsWrapper) {
      resultsWrapper.style.display = 'none';
    }
    const shopUniversalActions = document.getElementById('shop-universal-actions');
    if (shopUniversalActions) {
      shopUniversalActions.style.display = 'none';
    }
    
    // Update garage display to reflect cleared state
    updateGarageDisplay();
  };
})();
</script>
